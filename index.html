<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASINO UTM | Rompiendo Mitos</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/glass-theme.css">
</head>
<body>
    <div class="app-container">
        
        <aside class="glass-panel sidebar">
            <div class="sidebar-header">
                <h2>CASINO UTM</h2>
                <p>Probabilidad y Estadística</p>
            </div>
            
            <nav class="sidebar-nav">
                <button class="glass-btn nav-btn active" data-target="game1">1. Falacia del Jugador</button>
                <button class="glass-btn nav-btn" data-target="game2">2. Ganarle al Casino</button>
                <button class="glass-btn nav-btn" data-target="game3">3. Carta que nunca sale</button>
                <button class="glass-btn nav-btn" data-target="game4">4. Contagio en el salón</button>
                <button class="glass-btn nav-btn" data-target="game5">5. Suerte y N° de Intentos</button>
                <button class="glass-btn nav-btn" data-target="game6">6. Loot Box Simulator</button>
                <button class="glass-btn nav-btn" data-target="game7">7. ¿Qué número saldrá?</button>
                <button class="glass-btn nav-btn" data-target="game8">8. Ilusión de Precisión</button>
            </nav>
        </aside>

        <main class="main-workspace">
            
            <header class="glass-panel topbar">
                <div class="topbar-title">
                    <h3 id="current-game-title">Selecciona un juego</h3>
                </div>
                <div class="user-wallet">
                    <span>Fichas: </span>
                    <strong id="wallet-balance">1000</strong>
                    <button id="btn-recharge-modal" class="glass-btn small-icon-btn" style="margin-left: 10px; border-color: rgba(0, 255, 136, 0.4);">+</button>
                </div>
            </header>

            <section id="main-content" class="glass-panel content-area">
                <div class="welcome-message">
                    <h2>Bienvenido al Casino UTM</h2>
                    <p>Selecciona un minijuego en el panel izquierdo para comenzar a romper mitos.</p>
                </div>
            </section>

        </main>
    </div>

    <!-- Modal Principal de Recarga/Retiro -->
    <div id="wallet-modal" class="modal-overlay">
        <div class="glass-panel modal-content">
            <span class="modal-emoji">💰</span>
            <h2 class="text-neon-blue">Gestión de Fichas</h2>
            <p style="color: #aaa; margin-top: 10px;">Ingresa la cantidad deseada</p>
            
            <div class="chip-input-group">
                <button id="btn-minus-5" class="glass-btn step-btn">-5</button>
                <input type="number" id="input-chip-amount" class="chip-number-input" value="100" min="5" step="5">
                <button id="btn-plus-5" class="glass-btn step-btn">+5</button>
            </div>

            <div class="modal-actions">
                <button id="btn-action-add" class="glass-btn primary-btn" style="background: rgba(0, 255, 136, 0.2); border-color: #00ff88;">Aumentar</button>
                <button id="btn-action-remove" class="glass-btn primary-btn" style="background: rgba(255, 77, 77, 0.2); border-color: #ff4d4d;">Remover</button>
            </div>
            <button id="btn-close-modal" class="glass-btn secondary-btn" style="margin-top: 15px; width: 100%;">Cancelar</button>
        </div>
    </div>

    <!-- Modal de Confirmación -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="glass-panel modal-content">
            <span id="confirm-emoji" class="modal-emoji">✅</span>
            <h2 id="confirm-title" class="text-neon-green">¡Confirmado!</h2>
            <p id="confirm-text" style="color: #eee; margin: 15px 0; line-height: 1.5;"></p>
            <button id="btn-confirm-ok" class="glass-btn primary-btn" style="width: 100%;">Entendido</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
