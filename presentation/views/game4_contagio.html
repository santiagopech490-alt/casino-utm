<div class="game-container game4-layout">
    <div class="game-header">
        <h2 class="text-neon-blue">Contagio en el Salón</h2>
        <p class="game-description">
            Apuéstale a la persona que crees que se contagiará en la siguiente ronda. 
            El contagio solo se transmite entre <strong>vecinos directos</strong> (vecindad de Moore).
        </p>
    </div>

    <div class="game-board-container">
        <div id="epidemic-grid" class="epidemic-grid">
            <!-- Celdas generadas por JS -->
        </div>

        <div class="game-controls">
            <div class="control-panel glass-panel">
                <h4 class="text-neon-blue">Parámetros de Simulación</h4>
                
                <div class="stat-item">
                    <label for="input-p">Probabilidad de Contagio (p)</label>
                    <div class="input-wrapper">
                        <input type="range" id="input-p" min="0.1" max="1" step="0.1" value="0.5">
                        <strong id="val-p" class="text-neon-blue">0.5</strong>
                    </div>
                </div>

                <div class="stat-item">
                    <label for="input-limit">Máx. Contagios por Ronda</label>
                    <div class="input-wrapper">
                        <input type="number" id="input-limit" class="number-input" min="1" max="4" value="3">
                    </div>
                </div>

                <div class="stat-item">
                    <label for="input-bet">Monto a Apostar (Fichas)</label>
                    <div class="input-wrapper">
                        <input type="number" id="input-bet" class="number-input" min="5" step="5" value="10">
                    </div>
                </div>

                <button id="btn-next-round" class="glass-btn primary-btn" disabled>Siguiente Ronda</button>
                <button id="btn-reset-game" class="glass-btn secondary-btn" style="width: 100%;">Reiniciar Tablero</button>
            </div>

            <div class="legend glass-panel">
                <h4 class="text-neon-blue">Estado de los Nodos</h4>
                <div class="legend-item"><div class="persona sana"></div> Persona Sana</div>
                <div class="legend-item"><div class="persona contagiada"></div> Persona Contagiada</div>
                <div class="legend-item"><div class="persona seleccionada"></div> Tu Próxima Apuesta</div>
            </div>
        </div>
    </div>

    <div id="game-conclusion" class="conclusion-panel glass-panel hidden">
        <span class="conclusion-emoji">🧬</span>
        <p id="conclusion-text"></p>
    </div>
</div>
