<div class="glass-panel game-container animate-fade-in" style="max-width: 950px; margin: 0 auto; padding: 25px;">
    
    <header class="game-header" style="margin-bottom: 25px;">
        <h1 class="text-neon-gold">La carta que nunca sale</h1>
        <div class="myth-box glass-panel-dark" style="padding: 15px; border-left: 5px solid #ffd700;">
            <p><strong>El Mito:</strong> "Si una carta no ha salido en mucho tiempo, ahora es más probable que salga."</p>
        </div>
    </header>

    <div class="game-layout" style="display: grid; grid-template-columns: 1fr 320px; gap: 25px;">
        
        <!-- Área de Cartas -->
        <div class="cards-area">
            <h3 style="color: #ccc; margin-bottom: 15px; text-align: center;">Haz clic en una carta para apostar por ella</h3>
            <div id="cards-grid" class="cards-grid">
                <!-- 20 cartas generadas dinámicamente -->
            </div>
        </div>

        <!-- Panel de Control -->
        <div class="side-controls glass-panel-dark" style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">
            
            <div class="selection-box">
                <label for="bet-input" style="color: #888; font-size: 0.8rem; display: block; margin-bottom: 10px;">Apuesta a un número (1-20):</label>
                <input type="number" id="bet-input" class="chip-number-input" min="1" max="20" placeholder="N°">
            </div>

            <div class="bet-amount-selector">
                <label for="bet-amount-input" style="color: #888; font-size: 0.8rem; display: block; margin-bottom: 10px;">Monto a Apostar:</label>
                <div class="amount-selector" style="display: flex; align-items: center; gap: 15px;">
                    <button id="btn-bet-minus" class="step-btn">-</button>
                    <input type="number" id="bet-amount-input" class="chip-number-input" value="10" readonly>
                    <button id="btn-bet-plus" class="step-btn">+</button>
                </div>
            </div>

            <button id="btn-draw" class="glass-btn" disabled style="width: 100%; padding: 12px; font-size: 1rem;">Robar Carta (Premio x2)</button>
            <button id="btn-risky-bet" class="glass-btn primary-btn" disabled style="width: 100%; padding: 12px; font-size: 1rem;">Apuesta Arriesgada (Costo x2, Premio x3)</button>

            <div class="result-preview-area" style="margin-top: 15px;">
                 <label style="color: #888; font-size: 0.8rem; display: block; margin-bottom: 10px;">Resultado:</label>
                <div id="result-card-container" class="card-reveal-container">
                    <div id="result-card-inner" class="card-reveal-inner">
                        <div class="card-face card-back">?</div>
                        <div id="result-card-front" class="card-face card-front">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hotbar de Historial -->
    <div class="hotbar-container glass-panel-dark" style="margin-top: 20px; padding: 10px;">
        <h3 style="font-size: 0.8rem; color: #888; text-align: center; margin-bottom: 10px;">Últimas Cartas Robadas</h3>
        <div id="history-hotbar" class="history-hotbar"></div>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal" class="modal-overlay" style="display: none;">
        <div class="glass-panel modal-content animate-fade-in">
            <h2 class="text-neon-gold">¡Has Ganado!</h2>
            <p>Encontraste la carta correcta y ganaste <strong id="prize-amount"></strong> fichas.</p>
            <button id="btn-play-again" class="glass-btn primary-btn">Jugar de Nuevo</button>
        </div>
    </div>
</div>
